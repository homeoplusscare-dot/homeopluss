<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEOPLUSS • Patient Registration</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#18333b;background:radial-gradient(circle at 15% 10%,#fffdf5 0,#f7ffff 35%,#edf9fb 100%)}body{overflow-x:hidden}.app{min-height:100vh;padding:14px}.glass{background:linear-gradient(145deg,#fff,#fffdf7 55%,#f3fbfc);border:1px solid #eadfbd;border-radius:24px;box-shadow:0 18px 45px rgba(6,75,95,.13),inset 0 1px #fff;position:relative}.goldline{height:2px;background:linear-gradient(90deg,transparent,#d5b45b,#fff,#d5b45b,transparent);margin:8px 0 12px}.brand{font-weight:1000;letter-spacing:2px;font-size:clamp(24px,3vw,38px);color:#025da3;text-shadow:0 2px 0 #fff,0 4px 12px #00a8b333}.tag{color:#00a8b3;font-weight:800}.btn{border:1px solid #0a7990;border-radius:15px;padding:13px 18px;font-weight:1000;cursor:pointer;color:white;background:linear-gradient(145deg,#0579a0,#00a8b3 55%,#02628e);box-shadow:0 7px 0 #034f70,0 12px 24px #02628e33,inset 0 1px #fff8;transition:.18s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #034f70}.btn.gold{background:linear-gradient(145deg,#b58a25,#f3d77b,#b88b2e);border-color:#b88b2e;box-shadow:0 7px 0 #8d6a22,0 12px 24px #8d6a2230,inset 0 1px #fff}.btn.light{background:linear-gradient(145deg,#fff,#f8ffff);color:#025da3;border-color:#c7dfe4;box-shadow:0 5px 0 #c2d7db,0 10px 20px #6c8f9920}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#fff,#e8f9fb);border:1px solid #d8c681;box-shadow:inset 0 1px #fff,0 8px 18px #167c9230;font-size:25px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px}.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #dfcf98;font-weight:900;font-size:12px}.muted{color:#60757b;font-size:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:1000;color:#536a70;letter-spacing:.5px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #cbdfe3;border-radius:13px;background:#fff;font:inherit;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#00a8b3;box-shadow:0 0 0 4px #00a8b31a}.notice{padding:12px;border-radius:15px;background:linear-gradient(90deg,#fff,#f2fbfd);border:1px solid #d7e9ed;box-shadow:inset 0 1px #fff}.ticker{overflow:hidden;white-space:nowrap;font-weight:900;color:#025da3}.ticker span{display:inline-block;animation:marquee 18s linear infinite}@keyframes marquee{from{transform:translateX(100%)}to{transform:translateX(-100%)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}.modal{position:fixed;inset:0;background:#063b4dcc;display:none;place-items:center;z-index:99;padding:15px}.modal.show{display:grid}.modalbox{width:min(560px,96vw);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#fff,#fffdf7);border:2px solid #dfc776;border-radius:28px;padding:25px;text-align:center;box-shadow:0 30px 100px #002b3d66,inset 0 1px #fff}.blast{font-size:68px;animation:blast .65s ease}.check{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin:auto;background:radial-gradient(circle,#fff 35%,#dffcff 36%,#00a8b3 100%);box-shadow:0 0 0 8px #fff,0 0 35px #00a8b388;animation:float 1.4s infinite}@keyframes blast{0%{transform:scale(.1);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}.modal-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}.footer{padding:12px;text-align:center;color:#63777c;font-size:11px}.hidden{display:none!important}@media(max-width:800px){.app{padding:8px}.top{flex-wrap:wrap}.btn{padding:11px 13px}}</style></head><body><main class="app"><div class="glass top"><div style="display:flex;align-items:center;gap:12px"><div id="clinicIcon" class="icon">⚕</div><div><div id="brand" class="brand">HOMEOPLUSS</div><div id="tag" class="tag"></div></div></div><button class="btn light" id="back">← LOGIN</button></div><div class="goldline"></div><section class="glass" style="max-width:1000px;margin:auto;padding:22px"><div style="display:flex;align-items:center;gap:12px"><div class="icon">🪪</div><div><h1 style="margin:0;color:#025da3">NEW PATIENT REGISTRATION</h1><div class="muted">Create your permanent HOMEOPLUSS registration record</div></div></div><div class="notice" style="margin:14px 0"><b>Welcome Health Points:</b> <span id="welcomeHP">2000</span> HP <span id="welcomeState"></span><br><span class="muted">Controlled by Master Admin. Earned HP begins at 0.</span></div><form id="form"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px"><div class="field"><label>FULL NAME *</label><input id="name" required></div><div class="field"><label>GENDER *</label><select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="field"><label>DATE OF BIRTH *</label><input id="dob" type="date" required></div><div class="field"><label>AGE (AUTO)</label><input id="age" readonly></div><div class="field"><label>MOBILE NUMBER (FROM PAGE 1) *</label><input id="mobile" maxlength="10" inputmode="numeric" required></div><div class="field"><label>WHATSAPP / ALTERNATE MOBILE</label><input id="whatsapp" maxlength="10" inputmode="numeric"></div><div class="field" style="grid-column:1/-1"><label>ADDRESS</label><textarea id="address" rows="3"></textarea></div><div class="field"><label>SOURCE OF VISIT *</label><select id="source"><option>Walk-in</option><option>Online</option><option>Referred</option></select></div><div class="field" id="refWrap"><label>REFERRAL ID / REFERRER</label><input id="ref" placeholder="Existing patient registration ID"></div></div><div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" type="submit">PROCEED TO REGISTER →</button><button class="btn light" type="button" id="clear">CLEAR</button></div></form></section><div class="footer">${'HOMEOPLUSS'} • ${'HOMEOPLUSS Opp: Sai Mandir, Kalaburagi'} • ${'888 000 8224'}</div></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script>const K={P:'HPKYC_PATIENTS',S:'HPKYC_SETTINGS',C:'HPKYC_CURRENT_PATIENT'};const DEF={clinicName:'HOMEOPLUSS',clinicIcon:'⚕',tagline:'Homeopathy – Caring Naturally Since 1796',welcomeEnabled:true,welcomeHP:2000,earnedCap:500,schemes:{female:{enabled:true,points:100}}};function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function $(x){return document.getElementById(x)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function snd(){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=740;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.13)}catch(e){}}function popup(html){$('modalbox').innerHTML=html;$('modal').classList.add('show');snd()}function close(){ $('modal').classList.remove('show') }let s={...DEF,...get(K.S,{})};$('brand').textContent=s.clinicName;$('clinicIcon').textContent=s.clinicIcon||'⚕';$('tag').textContent=s.tagline;$('welcomeHP').textContent=s.welcomeEnabled?s.welcomeHP:0;$('welcomeState').textContent=s.welcomeEnabled?'':'(OFF)';let q=new URLSearchParams(location.search),pm=q.get('mobile')||get('HPKYC_REG_MOBILE','');if(!pm){let cur=get(K.C,null),p0=get(K.P,[]).find(p=>p.id===cur);pm=p0?.mobile||''} $('mobile').value=pm;$('dob').onchange=()=>{let d=new Date($('dob').value),n=new Date();if(isNaN(d))return;let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;$('age').value=Math.max(0,a)};$('back').onclick=()=>location.href='index.html';$('clear').onclick=()=>{$('form').reset();$('mobile').value=pm};$('source').onchange=()=>{$('refWrap').style.opacity=$('source').value==='Referred'?'1':'.55'};$('form').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),g=$('gender').value,d=$('dob').value,m=$('mobile').value.trim(),w=$('whatsapp').value.trim(),a=$('address').value.trim(),source=$('source').value,ref=$('ref').value.trim();if(!name||!g||!d||!/^[0-9]{10}$/.test(m)||w&&!/^[0-9]{10}$/.test(w)){popup(`<div class="blast">⚠</div><h2>CHECK FORM</h2><p>Please complete the required details correctly.</p><button class="btn" id="ok">OK</button>`);$('ok').onclick=close;return}let ps=get(K.P,[]),year=d.slice(0,4),reg='HP-'+m+'-'+year;if(ps.some(p=>p.regNo===reg)){popup(`<div class="blast">⚠</div><h2>ALREADY REGISTERED</h2><p>This mobile number and birth year already have a permanent registration ID.</p><button class="btn" id="ok">OK</button>`);$('ok').onclick=close;return}if(source==='Referred'&&(!ref||!ps.some(p=>p.regNo===ref||p.id===ref))){popup(`<div class="blast">🔗</div><h2>REFERRAL NOT FOUND</h2><p>Please enter a valid existing patient registration ID.</p><button class="btn" id="ok">OK</button>`);$('ok').onclick=close;return}let p={id:'P'+Date.now().toString(36).toUpperCase(),regNo:reg,name,gender:g,dob:d,dobYear:year,age:Number($('age').value||0),mobile:m,whatsapp:w,address:a,source,referralId:ref,referralStatus:ref?'Pending':'None',welcomeHP:s.welcomeEnabled?Number(s.welcomeHP||0):0,earnedHP:0,visits:0,ledger:[],appointments:[],communications:[],notes:[],prescription:[],assessmentReports:[],billing:[],packages:[],createdAt:new Date().toISOString()};ps.push(p);set(K.P,ps);set(K.C,p.id);popup(`<div class="check">✓</div><div class="blast">🎊</div><h2>CONGRATULATIONS, ${esc(name)}!</h2><p>Your HOMEOPLUSS registration is complete.</p><div class="pill">PERMANENT REGISTRATION ID</div><h2 style="color:#025da3;font-size:27px">${esc(reg)}</h2><div class="pill">WELCOME HP: ${p.welcomeHP}</div><p style="font-weight:900;color:#00a8b3">Welcome to HOMEOPLUSS • We wish you good health!</p><button class="btn" id="go">OPEN MY HEALTH BOOK →</button>`);$('go').onclick=()=>location.href='patient-health-book.html'};</script></body></html>
